[package]
name = "maxcode-cloud-config"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
maxcode-async-utils = { workspace = true }
maxcode-backend-client = { workspace = true }
maxcode-config = { workspace = true }
maxcode-http-client = { workspace = true }
maxcode-keyring-store = { workspace = true }
maxcode-login = { workspace = true }
maxcode-otel = { workspace = true }
maxcode-protocol = { workspace = true }
hmac = "0.12.1"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
wiremock = { workspace = true }
maxcode-agent-identity = { workspace = true }
maxcode-core = { workspace = true }
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }

[lib]
doctest = false
