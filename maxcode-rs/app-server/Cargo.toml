[package]
name = "maxcode-app-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "maxcode-app-server"
path = "src/main.rs"

[[bin]]
name = "maxcode-app-server-test-notify-capture"
path = "src/bin/notify_capture.rs"

[[bin]]
name = "exec-server"
path = "src/bin/exec_server.rs"

[lib]
name = "maxcode_app_server"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
maxcode-utils-process = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
axum = { workspace = true, default-features = false, features = [
    "http1",
    "json",
    "tokio",
    "ws",
] }
