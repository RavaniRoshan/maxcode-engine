[package]
name = "maxcode-app-server-transport"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "maxcode_app_server_transport"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
maxcode-http-client = { workspace = true }
maxcode-websocket-client = { workspace = true }
axum = { workspace = true, default-features = false, features = [
    "http1",
    "json",
    "tokio",
    "ws",
] }
base64 = { workspace = true }
maxcode-api = { workspace = true }
maxcode-app-server-protocol = { workspace = true }
maxcode-core = { workspace = true }
maxcode-login = { workspace = true }
maxcode-model-provider = { workspace = true }
maxcode-protocol = { workspace = true }
maxcode-state = { workspace = true }
maxcode-uds = { workspace = true }
maxcode-utils-absolute-path = { workspace = true }
maxcode-utils-rustls-provider = { workspace = true }
maxcode-websocket-auth = { workspace = true }
futures = { workspace = true }
gethostname = { workspace = true }
httpdate = { workspace = true }
owo-colors = { workspace = true, features = ["supports-colors"] }
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "process",
    "rt-multi-thread",
] }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true, features = ["log"] }
url = { workspace = true }
uuid = { workspace = true, features = ["serde", "v7"] }
zstd = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
signal-hook = { workspace = true }

[dev-dependencies]
chrono = { workspace = true }
maxcode-config = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
