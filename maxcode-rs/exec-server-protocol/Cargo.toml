[package]
name = "maxcode-exec-server-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "maxcode_exec_server_protocol"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
maxcode-file-system = { workspace = true }
maxcode-install-context = { workspace = true }
maxcode-network-proxy = { workspace = true }
maxcode-protocol = { workspace = true }
maxcode-shell-command = { workspace = true }
maxcode-skills = { workspace = true }
maxcode-utils-path-uri = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["arbitrary_precision", "raw_value"] }

[target.'cfg(windows)'.dependencies]
maxcode-mxc-sandbox = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
