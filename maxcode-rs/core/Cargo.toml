maxcode-thread-store = { workspace = true }
maxcode-tools = { workspace = true }
maxcode-utils-absolute-path = { workspace = true }
maxcode-utils-audio = { workspace = true }
maxcode-utils-cache = { workspace = true }
maxcode-utils-git-discovery = { workspace = true }
maxcode-utils-image = { workspace = true }
maxcode-utils-home-dir = { workspace = true }
maxcode-utils-output-truncation = { workspace = true }
