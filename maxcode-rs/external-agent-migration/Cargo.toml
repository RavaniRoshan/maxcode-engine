maxcode-login = { workspace = true }
maxcode-memories-write = { workspace = true }
maxcode-otel = { workspace = true }
maxcode-plugin = { workspace = true }
maxcode-protocol = { workspace = true }
maxcode-rollout = { workspace = true }
maxcode-thread-store = { workspace = true }
maxcode-utils-output-truncation = { workspace = true }
linkify = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tracing = { workspace = true }

[dev-dependencies]
maxcode-app-server-protocol = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
