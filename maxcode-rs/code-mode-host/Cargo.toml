[package]
name = "maxcode-code-mode-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "maxcode-code-mode-host"
path = "src/main.rs"

[lib]
doctest = false
name = "maxcode_code_mode_host"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
maxcode-http-client = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true, features = ["http1", "tokio", "ws"] }
clap = { workspace = true, features = ["derive"] }
maxcode-code-mode-protocol = { workspace = true }
maxcode-code-mode-runtime = { workspace = true }
maxcode-otel = { workspace = true }
maxcode-otel-trace-websocket = { workspace = true }
maxcode-protocol = { workspace = true }
futures = { workspace = true }
prost = "0.14.3"
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-stream = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
tonic = { workspace = true, features = ["router", "transport"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
maxcode-code-mode = { workspace = true }
maxcode-utils-cargo-bin = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
