[package]
edition.workspace = true
license.workspace = true
name = "maxcode-goal-extension"
version.workspace = true

[lib]
name = "maxcode_goal_extension"
path = "src/lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
maxcode-analytics = { workspace = true }
maxcode-core = { workspace = true }
maxcode-extension-api = { workspace = true }
maxcode-otel = { workspace = true }
maxcode-prompts = { workspace = true }
maxcode-protocol = { workspace = true }
maxcode-rollout = { workspace = true }
maxcode-state = { workspace = true }
maxcode-tools = { workspace = true }
maxcode-utils-template = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
maxcode-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
