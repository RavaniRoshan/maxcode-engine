[package]
edition.workspace = true
license.workspace = true
name = "maxcode-memories-extension"
version.workspace = true

[lib]
name = "maxcode_memories_extension"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
maxcode-core = { workspace = true }
maxcode-extension-api = { workspace = true }
maxcode-features = { workspace = true }
maxcode-otel = { workspace = true }
maxcode-protocol = { workspace = true }
maxcode-tools = { workspace = true }
maxcode-utils-absolute-path = { workspace = true }
maxcode-utils-output-truncation = { workspace = true }
maxcode-utils-template = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros"] }
