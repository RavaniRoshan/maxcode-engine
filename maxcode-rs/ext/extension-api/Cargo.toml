[package]
edition.workspace = true
license.workspace = true
name = "maxcode-extension-api"
version.workspace = true

[lib]
name = "maxcode_extension_api"
path = "src/lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
maxcode-core-plugin-common = { workspace = true }
maxcode-api = { workspace = true }
futures = { workspace = true }
maxcode-guardian-context = { workspace = true }
maxcode-history = { workspace = true }
maxcode-config = { workspace = true }
maxcode-context-fragments = { workspace = true }
maxcode-exec-server-protocol = { workspace = true }
maxcode-file-system = { workspace = true }
maxcode-mcp = { workspace = true }
maxcode-protocol = { workspace = true }
maxcode-tools = { workspace = true }
maxcode-utils-absolute-path = { workspace = true }
maxcode-utils-path-uri = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
