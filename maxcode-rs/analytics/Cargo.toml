[package]
edition.workspace = true
license.workspace = true
name = "maxcode-analytics"
version.workspace = true

[lib]
doctest = false
name = "maxcode_analytics"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
maxcode-http-client = { workspace = true }
maxcode-app-server-protocol = { workspace = true }
maxcode-git-utils = { workspace = true }
maxcode-login = { workspace = true }
maxcode-model-provider = { workspace = true }
maxcode-plugin = { workspace = true }
maxcode-protocol = { workspace = true }
maxcode-state = { workspace = true }
maxcode-utils-path-uri = { workspace = true }
os_info = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha1 = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
] }
tracing = { workspace = true, features = ["log"] }

[dev-dependencies]
maxcode-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
