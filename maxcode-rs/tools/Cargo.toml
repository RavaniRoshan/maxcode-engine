[package]
edition.workspace = true
license.workspace = true
name = "maxcode-tools"
version.workspace = true

[lints]
workspace = true

[dependencies]
bitflags = { workspace = true }
maxcode-attachment-store = { workspace = true }
maxcode-code-mode = { workspace = true }
maxcode-connectors = { workspace = true }
maxcode-features = { workspace = true }
maxcode-file-system = { workspace = true }
maxcode-extension-items = { workspace = true }
maxcode-protocol = { workspace = true }
maxcode-utils-output-truncation = { workspace = true }
maxcode-utils-path-uri = { workspace = true }
maxcode-utils-string = { workspace = true }
jsonptr = { workspace = true }
rmcp = { workspace = true, default-features = false, features = [
    "base64",
    "macros",
    "schemars",
    "server",
] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
thiserror = { workspace = true }
tracing = { workspace = true }
urlencoding = { workspace = true }

[dev-dependencies]
maxcode-utils-cargo-bin = { workspace = true }
pretty_assertions = { workspace = true }

[lib]
doctest = false
