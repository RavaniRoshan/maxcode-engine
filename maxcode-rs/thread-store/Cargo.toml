[package]
edition.workspace = true
license.workspace = true
name = "maxcode-thread-store"
version.workspace = true

[lib]
name = "maxcode_thread_store"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
chrono = { workspace = true, features = ["serde"] }
maxcode-app-server-protocol = { workspace = true }
maxcode-extension-items = { workspace = true }
maxcode-git-utils = { workspace = true }
maxcode-install-context = { workspace = true }
maxcode-otel = { workspace = true }
maxcode-protocol = { workspace = true }
maxcode-rollout = { workspace = true }
maxcode-state = { workspace = true }
maxcode-utils-absolute-path = { workspace = true }
maxcode-utils-path = { workspace = true }
maxcode-utils-path-uri = { workspace = true }
futures = { workspace = true }
pulldown-cmark = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sqlx = { workspace = true }
sqlx-macros = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
maxcode-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
uuid = { workspace = true }
