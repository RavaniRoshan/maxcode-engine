name: Release

# Builds reproducible release binaries on a tag push.
# The dev-small profile is for local low-RAM builds only; release assets use
# cargo's standard `release` profile.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: maxcode-engine-linux-x86_64
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            asset: maxcode-engine-macos-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: maxcode-rs

      - name: Build release binary
        working-directory: maxcode-rs
        run: cargo build --release --locked -p maxcode-cli --bin maxcode-engine --target ${{ matrix.target }}

      - name: Stage binary and checksum
        working-directory: maxcode-rs
        run: |
          set -euo pipefail
          mkdir -p ../dist
          cp "target/${{ matrix.target }}/release/maxcode-engine" "../dist/${{ matrix.asset }}"
          cd ../dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.asset }}*
          if-no-files-found: error

  release:
    name: publish-release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Combine checksums
        run: |
          set -euo pipefail
          cd dist
          cat ./*.sha256 > SHA256SUMS
          sha256sum -c SHA256SUMS
          rm -f ./*.sha256
          ls -l

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes "maxcode-engine release $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
